<style>

{display:flex;align-items:center;gap:10px;font-weight:850;white-space:nowrap}.mark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#3478fa,#26be83);color:#fff}.desktop-nav{display:flex;gap:23px}.desktop-nav button{border:0;background:transparent;color:#53647e;font-weight:750;white-space:nowrap}.desktop-nav button.active{color:var(--blue)}.mobile-menu{display:none}.icon{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#3d4d68;font-size:19px;display:grid;place-items:center}.screen{padding:22px;max-width:1140px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 7px 22px #17294d0d}.eyebrow{color:var(--blue);background:var(--soft);border-radius:99px;padding:5px 11px;display:inline-block;font-size:12px;font-weight:850}.title{font-size:28px;line-height:1.3;margin:13px 0}.muted{color:var(--muted)}.primary{border:0;border-radius:10px;background:linear-gradient(120deg,#2c80ff,#2653da);color:#fff;font-weight:800;padding:10px 17px;min-height:45px}.secondary{border:1px solid #cfddf3;background:#fff;color:#315db1;border-radius:10px;padding:9px 13px;min-height:44px;font-weight:750}.quiet{border:0;background:transparent;color:var(--blue);padding:8px;min-height:40px;font-weight:800}.field{min-width:0;border:1px solid #ccd9ef;border-radius:10px;min-height:46px;padding:0 12px;background:#fff;color:var(--ink)}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.note{color:#7c8ba2;font-size:12px}.state{border:1px dashed #b8cce8;border-radius:12px;background:#f9fbff;color:var(--muted);padding:25px;text-align:center}.state strong{display:block;color:var(--ink);margin-bottom:4px}.state.error{background:#fff8f8;border-color:#ebbbbb;color:var(--red)}
.work-grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(270px,1fr);gap:15px}.hero{padding:26px;background:radial-gradient(circle at 90% 15%,#dfeaff,transparent 35%),#fff}.hero .title{font-size:31px;background:linear-gradient(90deg,#47b977,#19b3d5,#3269e5);background-clip:text;color:transparent}.hero p{max-width:700px;color:#53627c;line-height:1.75}.hero-tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:8px;border:1px solid #d9e6fc;border-radius:13px 13px 0 0;margin-top:19px}.hero-tabs button{border:0;background:#fff;border-radius:8px;color:#5a6984;font-size:13px;font-weight:750;min-height:40px}.hero-tabs button.selected{color:#fff;background:linear-gradient(110deg,#3e88ff,#6945e7)}.hero-input{border:1px solid #d9e6fc;border-top:0;border-radius:0 0 13px 13px;padding:13px}.hero-input input{width:100%;margin-bottom:9px}.hero-input .primary{width:100%}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 10px;color:#53647e;font-size:12px}.todo{padding:18px}.section-title{font-size:18px;font-weight:850;margin:0 0 14px}.todo-row{display:flex;align-items:flex-start;gap:9px;border-top:1px solid var(--line);padding:13px 0}.todo-row input{width:18px;height:18px;accent-color:var(--blue)}.todo-row strong{font-size:13px}.tiles{grid-column:1/-1;padding:19px}.tile-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tile{border:1px solid var(--line);background:#fff;border-radius:10px;text-align:left;padding:14px;min-height:85px}.tile strong{display:block}.tile small{color:var(--muted)}
.kb-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px}.kb-list{padding:13px}.kb-list button{border:0;background:#fff;display:block;width:100%;text-align:left;padding:11px;border-radius:8px;color:#50607a}.kb-list button.active{background:var(--soft);color:#2266ce;font-weight:800}.kb-main{min-width:0;display:flex;flex-direction:column;height:580px;overflow:hidden}.kb-toolbar{padding:12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}.kb-path{font-weight:850;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kb-select{display:none}.kb-body{flex:1;min-height:0;overflow:auto;padding:18px}.kb-body p{line-height:1.8;color:#4c5d78}.kb-body blockquote{margin:17px 0;padding:14px;background:#f3f7ff;border-left:3px solid var(--blue)}.kb-editor{display:grid;grid-template-columns:1fr 1fr;flex:1;min-height:0}.kb-editor>div{min-width:0;overflow:auto}.kb-editor textarea{width:100%;height:100%;min-height:320px;border:0;background:#1e293b;color:#e7efff;padding:15px;font:13px/1.5 Consolas,monospace}.kb-edit-tabs{display:none}.kb-foot{border-top:1px solid var(--line);padding:9px;display:flex;justify-content:flex-end;gap:8px}
.profile{display:grid;grid-template-columns:1fr 1fr;gap:16px}.profile>div{padding:22px;min-width:0}.profile-art{min-height:270px;border-radius:12px;background:linear-gradient(135deg,#dce8ff,#d6f4e7);display:grid;place-items:center;font-size:48px}.profile p{color:var(--muted)}.space-card{padding:25px;max-width:680px}.space-card .illustration{height:170px;border-radius:11px;background:linear-gradient(130deg,#1e3d74,#688cc4 60%,#d9e5fa);display:grid;place-items:center;color:#fff;font-size:44px;margin-bottom:19px}
.fab{position:absolute;z-index:18;right:17px;bottom:83px;width:58px;height:58px;border-radius:50%;border:0;color:#fff;font-weight:900;background:radial-gradient(circle at 32% 25%,#e7fbff,#6fd8ff 28%,#2e86f3 67%,#3765df);box-shadow:0 9px 23px #1c7cf86b,0 0 0 6px #b9dafa88;touch-action:none;user-select:none}.fab.dragging{opacity:.85}.shade{position:absolute;inset:0;background:#12244288;z-index:30}.drawer{height:100%;width:290px;max-width:86%;background:#fff;padding:15px;box-shadow:10px 0 30px #10284c33}.drawer-head{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:850;margin-bottom:15px}.drawer .nav-item{width:100%;display:block;border:0;background:#fff;text-align:left;padding:13px 10px;border-radius:9px;color:#40516e;min-height:46px}.drawer .nav-item.active{color:var(--blue);background:var(--soft);font-weight:850}.drawer .hint{font-size:12px;color:#9a6a1c;background:#fff8e9;padding:10px;border-radius:9px;margin-top:13px}.chat{position:absolute;z-index:35;top:0;right:0;bottom:0;width:430px;max-width:100%;background:#fff;display:flex;flex-direction:column;box-shadow:-15px 0 35px #11264d2d}.chat-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:#fff;background:linear-gradient(105deg,#306cea,#485de3);min-height:64px}.chat-head strong{display:block}.chat-head small{color:#dce6ff}.chat-head .icon{background:#ffffff22;color:#fff;border-color:#ffffff33;width:38px;height:38px;font-size:17px}.chat-messages{flex:1;min-height:0;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:11px;background:#f8fbff}.message{max-width:85%;border-radius:12px;padding:10px 12px;background:#fff;border:1px solid var(--line);align-self:flex-start}.message.mine{background:#e8f1ff;border-color:#cfe2ff;align-self:flex-end}.chat-compose{padding:11px;border-top:1px solid var(--line);background:#fff;display:flex;gap:7px}.chat-compose input{flex:1;min-width:0}.chat-history{position:absolute;z-index:36;top:64px;right:0;bottom:0;width:280px;max-width:88%;background:#fff;border-left:1px solid var(--line);padding:13px}.chat-history button{display:block;width:100%;text-align:left;border:0;background:#fff;border-radius:8px;padding:10px}.chat-history button:hover{background:var(--soft)}.modal-wrap{position:absolute;z-index:40;inset:0;background:#15213b80;display:grid;place-items:center;padding:13px}.modal{background:#fff;border-radius:14px;padding:20px;width:min(390px,100%)}.modal h3{margin:0 0 7px}.modal p{color:var(--muted)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.foot{max-width:1180px;margin:0 auto 30px;padding:0 20px;color:#65758f;font-size:13px}
@container(max-width:800px){.topbar{height:58px;padding:0 11px}.desktop-nav{display:none}.mobile-menu{display:grid}.screen{padding:13px}.title{font-size:23px}.work-grid{grid-template-columns:minmax(0,1fr)}.work-grid>*{min-width:0}.hero{padding:15px;overflow:hidden}.hero .title{font-size:25px}.hero-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-tabs button:last-child{grid-column:1/-1}.tiles{grid-column:auto}.tile-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.kb-layout{display:block}.kb-list{display:none}.kb-select{display:inline-flex}.kb-main{height:590px}.kb-toolbar .kb-path{flex:1 1 100%;order:-1}.kb-editor{display:block}.kb-editor .preview-pane{display:none}.kb-editor.preview .preview-pane{display:block;height:100%}.kb-editor.preview .source-pane{display:none}.kb-editor .source-pane{height:100%}.kb-edit-tabs{display:flex;gap:5px;padding:7px;border-bottom:1px solid var(--line)}.profile{grid-template-columns:1fr}.profile>div{padding:16px}.space-card{padding:17px}.chat{width:100%}.fab{right:15px;bottom:80px}}
.stage{position:relative}.shade,.modal-wrap{top:33px}.chat{top:33px}.fab{bottom:78px}
@container(max-width:340px){.brand .brand-name{font-size:13px}.tile-grid{grid-template-columns:1fr}.hero-tabs button{font-size:12px}.fab{width:54px;height:54px}.kb-toolbar .secondary{padding:7px 9px}}

</head>
<body>
<div class="page-head"><span class="tag">当前提案 · v0.2.0 · 2026-09-16</span><h1>ltbot 四功能 H5 响应式原型</h1><p>范围：工作台、技能知识库、睡眠空间、关于我；AI 悬浮球打开 RemoteChat。点击切换屏宽、页面与状态。</p></div>
<div class="controls"><button class="ctrl" data-device="small">手机 320</button><button class="ctrl on" data-device="phone">手机 390</button><button class="ctrl" data-device="desktop">PC 1180</button><span>页面</span><button class="ctrl on" data-page="workbench">工作台</button><button class="ctrl" data-page="kb">技能知识库</button><button class="ctrl" data-page="space">睡眠空间</button><button class="ctrl" data-page="profile">关于我</button><span>状态</span><button class="ctrl on" data-state="normal">正常</button><button class="ctrl" data-state="loading">加载</button><button class="ctrl" data-state="empty">空</button><button class="ctrl" data-state="error">错误</button></div>
<div class="stage-wrap"><div class="stage phone" id="stage"><div class="browser"><i></i><i></i><i></i><span id="browser-path">ltbot.top/#/workbench · 390px</span></div><div class="viewport" id="viewport"><div class="app" id="app"></div></div><div id="layer"></div></div></div>
<div class="foot">原型内容和聊天回复均为示例。工作台待办、知识库、RemoteChat 会话与 SSE 依赖真实接口；睡眠空间为外部网站。Hero 其他 tab 仅保留现有布局示意，不纳入本期新增能力。</div>
<script>
const S={device:'phone',page:'workbench',state:'normal',overlay:'',modal:'',tab:'Agent对话',heroText:'帮我把今天的项目事项整理成周报，并',chatText:'',chatMessages:[],history:false,doc:'',edit:false,editTab:'preview',dirty:false,pendingDoc:''};
const app=document.getElementById('app');const docs=['工作台使用说明.html','Agent 开发笔记.html','技能知识库指南.html'];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function state(label){if(S.state==='normal')return '';return `<div class="state ${S.state==='error'?'error':''}"><strong>${S.state==='loading'?'正在加载…':S.state==='empty'?'暂无'+label:'加载失败'}</strong>${S.state==='error'?`请检查网络后 <button class="quiet" data-action="retry">重试</button>`:S.state==='empty'?'可稍后再试或创建第一条。':'请稍候'}</div>`}
function header(){return `<header class="topbar"><div class="row"><button class="icon mobile-menu" aria-label="打开菜单" data-action="menu">☰</button><div class="brand"><div class="mark">Ai</div><span class="brand-name">Aion 工作台</span></div></div><nav class="desktop-nav">${[['workbench','工作台'],['kb','技能知识库'],['space','睡眠空间 ↗'],['profile','关于我']].map(([p,n])=>`<button class="${S.page===p?'active':''}" data-page="${p}">${n}</button>`).join('')}</nav></header>`}
function workbench(){return `<main class="screen"><div class="work-grid"><section class="card hero"><div class="eyebrow">效率中枢 · 让 AI 先完成第一版</div><h1 class="title">开始您一天的工作吧！<br>工欲善其事必先利其器！</h1><p>AI 工作台聚合 Agent 对话、全局搜索、工作流编排和项目知识库。只需要描述目标，系统自动推荐工具、拆解任务、调用模板并沉淀结果。</p><div class="hero-tabs">${['Agent对话','搜索','社区','生活','站内文章'].map(t=>`<button class="${S.tab===t?'selected':''}" data-tab="${t}">${t}</button>`).join('')}</div><div class="hero-input"><input id="heroInput" class="field" value="${esc(S.heroText)}" aria-label="工作台指令"><button class="primary" data-action="hero-open">${S.tab==='Agent对话'?'开始执行':'保持现有去向'}</button></div><div class="chips"><button class="chip" data-action="quick">生成需求文档</button><button class="chip" data-action="quick">总结会议纪要</button></div><div class="note" style="margin-top:11px">Agent 输入将带入 RemoteChat 草稿，仍需用户点击发送。</div></section><section class="card todo"><div class="row between"><h2 class="section-title">AI 待办</h2><button class="quiet" data-action="todo">＋ 新增</button></div>${S.state==='normal'?`<div class="todo-row"><input type="checkbox" aria-label="完成移动端原型检查"><div><strong>检查移动端原型</strong><div class="note">示例 · 高优先级</div></div></div><div class="todo-row"><input type="checkbox" aria-label="完成知识库目录验收"><div><strong>验收知识库目录</strong><div class="note">示例 · 中优先级</div></div></div>`:state('待办')}<div class="note">真实数据源：agency store / API</div></section><section class="card tiles"><h2 class="section-title">工具与资源 <span class="note">静态展示</span></h2><div class="tile-grid"><button class="tile" data-action="static"><strong>✦ 文档助手</strong><small>能力展示</small></button><button class="tile" data-action="static"><strong>⌕ 知识检索</strong><small>能力展示</small></button><button class="tile" data-action="static"><strong>▦ 工作流</strong><small>能力展示</small></button></div></section></div></main>`}
function kbTree(){return docs.map(d=>`<button class="${S.doc===d?'active':''}" data-doc="${esc(d)}">▤ &nbsp;${esc(d)}</button>`).join('')}
function kbDoc(){return `<div class="kb-body"><div class="eyebrow">HTML 文档预览 · 示例</div><h2>${esc(S.doc)}</h2><p>文档正文在独立阅读区内滚动。实际 HTML 内容由技能知识库接口提供，其自身是否响应式需逐篇核对。</p><blockquote>手机端目录默认收起；顶部操作不会压住标题和正文。</blockquote><p>更多操作可在新标签打开原文或下载源文件。</p></div>`}
function kb(){let content=S.state==='normal'?(S.doc?S.edit?`<div class="kb-edit-tabs"><button class="secondary" data-action="kb-preview">预览</button><button class="secondary" data-action="kb-source">源码</button></div><div class="kb-editor ${S.editTab==='preview'?'preview':''}"><div class="preview-pane">${kbDoc()}</div><div class="source-pane"><textarea id="kbSource" aria-label="HTML 源码">&lt;h1&gt;${esc(S.doc)}&lt;/h1&gt;\n&lt;p&gt;源码编辑示例&lt;/p&gt;</textarea></div></div><div class="kb-foot"><button class="secondary" data-action="kb-cancel">取消</button><button class="primary" data-action="kb-save">保存</button></div>`:kbDoc():`<div class="kb-body"><div class="state"><strong>请选择文档</strong>打开目录并选择一篇 HTML 文档。</div></div>`):`<div class="kb-body">${state('文档')}</div>`;return `<main class="screen"><div class="eyebrow">技能知识库 · 接口数据</div><h1 class="title">阅读与查找技能文档</h1><div class="kb-layout"><aside class="card kb-list"><h3>菜单列表</h3>${kbTree()}</aside><section class="card kb-main"><div class="kb-toolbar"><button class="secondary kb-select" data-action="kb-menu">☰ 选文档</button><div class="kb-path" title="${esc(S.doc||'请选择文档')}">${esc(S.doc||'请选择文档')}</div><button class="secondary" data-action="kb-preview">预览</button><button class="secondary" data-action="kb-edit">${S.edit?'编辑中':'编辑'}</button><button class="icon" data-action="kb-more" aria-label="更多操作">⋯</button></div>${content}</section></div><p class="note">生产环境编辑锁需真实构建确认。原型仅演示允许编辑环境的移动布局。</p></main>`}
function space(){return `<main class="screen"><div class="eyebrow">外部网站 · space.ltbot.top</div><h1 class="title">睡眠空间</h1><section class="card space-card"><div class="illustration">☾</div><h2>打开睡眠空间</h2><p class="muted">这是外部网站入口。正式页面将在新标签打开；如果浏览器阻止弹窗，将显示手动打开链接。</p><button class="primary" data-action="external">打开外部网站 ↗</button><p class="note">此原型不会跳出当前文件。</p></section></main>`}
function profile(){return `<main class="screen"><div class="eyebrow">个人介绍 · /user</div><h1 class="title">关于我</h1><div class="profile"><div class="card"><h2>个人信息</h2><p>手机端个人信息卡纵向排列，内容可自然滚动到底部。</p><div class="profile-art">⌘</div><p>项目经历 · 技术栈 · 联系方式</p></div><div class="card"><h2>开发者档案</h2><p>资料卡和已有交互保持可用。背景装饰不盖住文字、按钮与链接。</p><div class="state"><strong>jinming jiang</strong>前端工程师 · 内容示意</div><p>此处继续放置个人介绍、作品与联系信息。</p></div></div></main>`}
function overlay(){if(S.overlay==='menu')return `<div class="shade" data-action="close"><div class="drawer" data-inside="1"><div class="drawer-head">导航 <button class="icon" data-action="close" aria-label="关闭菜单">×</button></div>${[['workbench','工作台'],['kb','技能知识库'],['space','睡眠空间 ↗'],['profile','关于我']].map(([p,n])=>`<button class="nav-item ${S.page===p?'active':''}" data-page="${p}">${n}</button>`).join('')}<div class="hint">睡眠空间是外部网站；其余三项留在 ltbot。</div></div></div>`;if(S.overlay==='kb-menu')return `<div class="shade" data-action="close"><div class="drawer" data-inside="1"><div class="drawer-head">选择文档 <button class="icon" data-action="close">×</button></div>${kbTree()}</div></div>`;if(S.overlay==='chat')return `<div class="shade" data-action="close"></div><section class="chat" role="dialog" aria-label="RemoteChat 交互示意"><div class="chat-head"><div><strong>Remote AI 助手</strong><small>真实会话与 SSE 由 RemoteChat 提供</small></div><div class="row"><button class="icon" data-action="new-chat" aria-label="新对话">＋</button><button class="icon" data-action="history" aria-label="历史对话">◷</button><button class="icon" data-action="close" aria-label="关闭聊天">×</button></div></div><div class="chat-messages">${S.state==='error'?state('聊天'):S.chatMessages.length?S.chatMessages.map(m=>`<div class="message ${m.mine?'mine':''}">${esc(m.text)}</div>`).join(''):`<div class="state"><strong>今天有什么可以帮到你？</strong>直接提问，或先确认工作台带入的草稿。</div>`}</div><div class="chat-compose"><input class="field" id="chatInput" aria-label="RemoteChat 草稿" value="${esc(S.chatText)}" placeholder="给 Remote AI 助手发送消息"><button class="primary" data-action="send">发送</button></div>${S.history?`<div class="chat-history"><div class="drawer-head">历史对话 <button class="icon" data-action="history">×</button></div><button data-action="history-select">当前会话</button><button data-action="history-select">周报整理</button><p class="note">会话数据依赖现有 chat store/API</p></div>`:''}</section>`;return ''}
function modal(){if(!S.modal)return '';let x=S.modal==='external'?['离开 ltbot','正式产品将在新标签打开睡眠空间。弹窗被拦截时应提供可点击的外链。']:S.modal==='dirty'?['未保存的修改','继续将丢弃当前 HTML 源码修改。']:S.modal==='todo'?['新增待办','正式页面调用待办接口；此处只展示移动端弹层。']:['展示内容','此卡片目前是展示内容，不代表工作流已可执行。'];return `<div class="modal-wrap"><div class="modal"><h3>${x[0]}</h3><p>${x[1]}</p><div class="modal-actions"><button class="secondary" data-action="modal-close">取消</button><button class="primary" data-action="modal-confirm">${S.modal==='dirty'?'放弃修改':'知道了'}</button></div></div></div>`}
function render(){const st=document.getElementById('stage');st.classList.toggle('phone',S.device!=='desktop');st.classList.toggle('small',S.device==='small');document.getElementById('browser-path').textContent=`ltbot.top/#/${S.page==='kb'?'skillKnowledgeBase':S.page==='profile'?'user':S.page==='space'?'createSpace':'workbench'} · ${S.device==='small'?'320':S.device==='phone'?'390':'1180'}px`;app.innerHTML=header()+({workbench,kb,space,profile}[S.page])();document.getElementById('layer').innerHTML=(S.overlay==='chat'?'':`<button class="fab" id="aiFab" aria-label="打开 AI 助手" data-action="chat">AI</button>`)+overlay()+modal();document.querySelectorAll('.ctrl').forEach(b=>b.classList.toggle('on',b.dataset.device===S.device||b.dataset.page===S.page||b.dataset.state===S.state));bindFab()}
document.addEventListener('input',e=>{if(e.target.id==='heroInput')S.heroText=e.target.value;if(e.target.id==='chatInput')S.chatText=e.target.value;if(e.target.id==='kbSource')S.dirty=true});
document.addEventListener('click',e=>{if(S.suppressClick&&e.target.closest('#aiFab')){S.suppressClick=false;return}const b=e.target.closest('[data-device],[data-page],[data-state],[data-tab],[data-doc],[data-action]');if(!b)return;const d=b.dataset;if(d.device){S.device=d.device;S.overlay=''}else if(d.page){if(d.page==='space'&&b.closest('.drawer,.desktop-nav')){S.overlay='';S.modal='external'}else if(S.edit&&S.dirty&&S.page==='kb'){S.pendingPage=d.page;S.modal='dirty'}else{S.page=d.page;S.overlay='';S.state='normal'}}else if(d.state){S.state=d.state}else if(d.tab){S.tab=d.tab}else if(d.doc){if(S.edit&&S.dirty){S.pendingDoc=d.doc;S.modal='dirty'}else{S.doc=d.doc;S.overlay='';S.state='normal'}}else if(d.action){if(d.action==='close'&&e.target.closest('[data-inside]')&&b===e.target.closest('.shade'))return;switch(d.action){case'menu':S.overlay='menu';break;case'close':S.overlay='';S.history=false;break;case'chat':S.overlay='chat';break;case'hero-open':if(S.tab==='Agent对话'){S.chatText=S.heroText;S.overlay='chat'}else S.modal='static';break;case'send':if(S.chatText.trim()){S.chatMessages.push({mine:true,text:S.chatText.trim()},{mine:false,text:'已收到。这是原型示例回复；正式结果来自 RemoteChat。'});S.chatText=''}break;case'history':S.history=!S.history;break;case'history-select':S.history=false;break;case'new-chat':S.chatMessages=[];S.chatText='';S.history=false;break;case'kb-menu':S.overlay='kb-menu';break;case'kb-edit':if(S.doc){S.edit=true;S.editTab='source'}break;case'kb-preview':S.editTab='preview';break;case'kb-source':S.editTab='source';break;case'kb-cancel':S.modal='dirty';break;case'kb-save':S.edit=false;S.dirty=false;S.editTab='preview';break;case'kb-more':S.modal='static';break;case'quick':S.heroText=b.textContent.trim();break;case'todo':S.modal='todo';break;case'external':S.modal='external';break;case'static':S.modal='static';break;case'retry':S.state='normal';break;case'modal-close':S.modal='';S.pendingDoc='';S.pendingPage='';break;case'modal-confirm':if(S.modal==='dirty'){S.edit=false;S.dirty=false;if(S.pendingDoc){S.doc=S.pendingDoc;S.overlay=''}if(S.pendingPage){S.page=S.pendingPage;S.overlay=''}}S.pendingDoc='';S.pendingPage='';S.modal='';break}}render()});
function bindFab(){const fab=document.getElementById('aiFab');if(!fab)return;let start=null;fab.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY,right:parseFloat(getComputedStyle(fab).right),bottom:parseFloat(getComputedStyle(fab).bottom),moved:false};fab.setPointerCapture(e.pointerId)});fab.addEventListener('pointermove',e=>{if(!start)return;let dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>7)start.moved=true;if(start.moved){fab.classList.add('dragging');const box=document.getElementById('viewport');fab.style.right=Math.max(10,Math.min(box.clientWidth-58,start.right-dx))+'px';fab.style.bottom=Math.max(15,Math.min(box.clientHeight-58,start.bottom-dy))+'px'}});fab.addEventListener('pointerup',()=>{if(start?.moved)S.suppressClick=true;start=null;fab.classList.remove('dragging')})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){S.overlay='';S.modal='';S.history=false;render()}if(e.key==='Enter'&&e.target.id==='chatInput'){e.preventDefault();document.querySelector('[data-action="send"]')?.click()}});
render();
</script>
</body></html>
