S.stories.unshift(job);S.activeStory=job.id;S.job=job.id;S.view='loading';render();scheduleGeneration();
}
function scheduleGeneration(){clearTimeout(generationTimer);const id=S.job;generationTimer=setTimeout(()=>{const job=storyById(id);if(!job||job.status!=='generating')return;if(S.scenario==='failure'){job.status='failed';if(S.view==='loading'){S.view='failure';render();}}else if(S.scenario==='slow'){if(S.view==='loading')render();}else{job.status='completed';if(S.view==='loading'){S.view='receipt';render();}else notify('故事编织好了，可在“我的”查看');}},2600);}
function renderLoading(){const s=storyById(S.job);$('#app').innerHTML='<div class="wrap narrow"><div class="empty"><div class="loader-orbit">☾</div><h2>正在为'+esc(s.snapshot.child.nickname)+'编织故事</h2><p>'+worldById(s.snapshot.world).name+'里的晚安冒险，正在慢慢展开。</p><div class="notice">'+(S.scenario==='slow'?'这次比平时久一点，你可以先回“我的”看看。':'故事生成需要一点时间，你可以先离开这个页面。')+'</div><button class="secondary" data-route="mine" style="margin-top:24px">稍后去我的故事查看</button></div></div>';}
function renderFailure(){$('#app').innerHTML='<div class="wrap narrow"><div class="empty"><div class="empty-icon">☁️</div><h2>这次故事没有编织完成</h2><p>你的主角设定和今晚的小事都还在。</p><div class="row" style="justify-content:center;flex-wrap:wrap"><button class="secondary" data-action="back-to-form">返回修改</button><button class="primary" data-action="retry">重新尝试</button></div></div></div>';}
function renderDenied(){$('#app').innerHTML='<div class="empty"><div class="empty-icon">📖</div><h2>故事不存在或暂不可访问</h2><p>可以去探索其他公开故事。</p><button class="primary" data-route="explore">探索故事</button></div>';}
function render(){renderHeader();$('#actions').innerHTML='';if(S.view==='create')renderCreate();else if(S.view==='mine')renderMine();else if(S.view==='profiles')renderProfiles();else if(S.view==='story')renderStory();else if(S.view==='receipt')renderReceipt();else if(S.view==='loading')renderLoading();else if(S.view==='failure')renderFailure();else if(S.view==='denied')renderDenied();else if(S.view==='explore')$('#app').innerHTML='<div class="wrap"><div class="row between" style="margin-bottom:24px"><h1 style="font-size:24px">探索故事</h1><button class="primary" data-route="create">创作故事</button></div>'+storyCards(S.stories.filter(s=>s.visibility==='PUBLIC'&&s.status==='completed'))+'</div>';}
function resetDraft(id){const p=S.profiles.find(x=>x.id===id&&!x.deleted);S.selected=p?.id||null;S.hero=p?clone(p):null;S.step=1;S.world='ocean';S.theme='安静入睡';S.customTheme='';S.material='';S.intent='今天发生的事';navigate('create');}
function review(){openModal('原型评审 · v1.2.1','<div class="review-panel"><p><b>验证重点：</b>以现有产品为底，完成一期私密定制闭环。所有档案、故事、计数及语音控件均为本地演示，刷新重置；不调用登录、生成或支付服务。</p><h3>建议体验路径</h3><p>创作故事 → 切换/新建档案 → 梦境 → 成长主题与今晚小事 → 生成 → 回执 → 详情 → 同档案再讲 → 我的按孩子筛选。</p><h3>直接查看边界状态</h3><label for="scene">演示场景</label><select id="scene"><option value="normal">已有档案 · 正常创作</option><option value="empty">首次使用 · 无档案</option><option value="failure">生成失败 · 保留输入重试</option><option value="slow">生成较慢 · 稍后回来</option><option value="risk">素材风险拦截 · 模拟服务端判定</option><option value="guest">未登录 · 创作需登录</option><option value="denied">非作者访问私密故事</option><option value="list-loading">我的故事 · 加载中</option><option value="list-error">我的故事 · 加载失败</option></select><button class="primary" style="margin-top:12px" data-action="apply-scene">载入示例场景</button><p class="small muted" style="margin-top:8px">切换场景将重置当前演示数据；会再次确认。</p><h3>现状依据</h3><ul><li>品牌、桌面导航：Header.tsx / MenuList。</li><li>底栏沿用首页、探索故事、音乐广场、我的的图标式导航。</li><li>主角 → 梦境 → 成长主题：create-story/page.tsx。</li><li>性格、年龄、伙伴、横滑梦境卡片、主题九宫格：现有三个创作组件。</li><li>米色默认、紫粉可切换：layout.tsx / globals.css。</li><li>我的：原有笔记 / 收藏 / 赞过与 3:4 卡片；详情保留封面、作者、正文和听全文入口。</li></ul><h3>本次补充</h3><p>档案保存与切换确认、临时设定、今晚小事、私密回执；已移除“故事口味／今晚语气”，由统一规则自动决定睡前风格；快照摘要、真实筛选、删除恢复、失败重试。历史公开内容无专属回执。</p><h3>评审边界</h3><p>语音为播放状态演示，无实际音频；关键词过滤不代表内容审核，风险状态只模拟服务端拒绝。积分沿用现有机制，原型不扣费、不增加退款承诺。首页、音乐等未改页面链接至现有站点新标签页。</p><p style="margin-top:10px"><a href="2026-09-04_故事深度定制化PRD_v1.3.0.html" target="_blank">当前 PRD v1.3.0 ↗</a> · <a href="2026-09-04_故事深度定制化排期计划_v1.3.0.md" target="_blank">当前计划 ↗</a></p><p class="muted small">本原型仍只覆盖一期私密定制闭环；第二期自定义头像与直接公开尚未同步。未经服务端访问控制验收，原型中的锁图标不代表已上线的隐私保护。</p></div>');}
function applyScene(scene){clearTimeout(generationTimer);clearInterval(audioTimer);S.profiles=clone(seedProfiles);S.stories=clone(initialStories);S.signedIn=true;S.scenario=scene;S.listState='normal';S.job=null;S.tab='stories';S.filter='all';if(scene==='empty'){S.profiles=[];S.stories=[];}if(scene==='guest')S.signedIn=false;resetDraft(liveProfiles()[0]?.id);if(['failure','slow','risk'].includes(scene)){S.step=3;S.material='今天主动把玩具借给了好朋友。';S.theme='学会分享';render();}if(scene==='denied')navigate('denied');if(scene.startsWith('list-')){S.listState=scene==='list-loading'?'loading':'error';navigate('mine');}}
document.addEventListener('input',e=>{const k=e.target.dataset.input;if(!k)return;const v=e.target.value;if(k==='hero-name')S.hero.nickname=v;if(k==='edit-name'&&editor)editor.data.nickname=v;if(k==='custom-theme'){S.customTheme=v;document.querySelectorAll('[data-action="growth"]').forEach(b=>b.classList.toggle('selected',!v&&b.dataset.value===S.theme));$('#summary-theme').textContent=v||S.theme;}if(k==='material'){S.material=v;$('#material-count').textContent=Array.from(v).length+' / 80';$('#material-error').innerHTML='';}});
document.addEventListener('click',e=>{
const b=e.target.closest('[data-action],[data-route]');if(!b)return;
if(b.dataset.route){e.preventDefault();navigate(b.dataset.route);return;}
const a=b.dataset.action,v=b.dataset.value,id=b.dataset.id;
if(a==='close')return closeModal();
if(a==='confirm'){const cb=confirmCallback;closeModal();if(cb)cb();return;}
if(a==='review')return review();
if(a==='theme'){openModal('选择风格','<div class="grid2"><button class="choice" data-action="set-theme" data-value="beige">🟤 米色风</button><button class="choice" data-action="set-theme" data-value="purple">🟣 紫粉风</button></div>');return;}
if(a==='set-theme'){document.documentElement.dataset.siteTheme=v;closeModal();return;}
if(a==='menu'){$('#mobile-menu').classList.toggle('open');b.setAttribute('aria-expanded',$('#mobile-menu').classList.contains('open'));return;}
if(a==='logout'){S.signedIn=false;navigate('create');return;}
if(a==='login'){openModal('登录演示','<p>此处承接现有手机号登录流程。原型使用示例账号体验，不填写真实手机号或密码。</p><div class="dialog-actions"><button class="primary" data-action="login-demo">使用示例账号继续</button></div>');return;}
if(a==='login-demo'){S.signedIn=true;closeModal();render();return;}
if(a==='picker')return profilePicker();
if(a==='pick-profile')return chooseProfile(id);
if(a==='new-from-create')return showEditor(null,'create');
if(a==='new-profile')return showEditor(null,'profiles');
if(a==='edit-profile')return showEditor(id,'profiles');
if(a==='save-profile')return saveProfile();
if(a==='delete-profile'){const p=S.profiles.find(x=>x.id===id);confirm('删除'+p.nickname+'的档案？','删除后，创作时不能再选择这个档案。已经生成的故事和当时的专属设定都会保留；之后可以在已删除档案中恢复。','确认删除',()=>{p.deleted=true;if(S.selected===id){S.selected=null;S.hero=null;}render();notify('档案已删除，已有故事仍然保留');});return;}
if(a==='restore'){S.profiles.find(x=>x.id===id).deleted=false;render();notify('档案已恢复');return;}
if(a==='create-for')return resetDraft(id);
if(a.startsWith('hero-')||a.startsWith('edit-')){
const isEdit=a.startsWith('edit-'),h=isEdit?editor.data:S.hero,field=a.slice(5);
const refresh=()=>{if(isEdit)renderEditor();else render();};
if(field==='name')return;
if(field==='avatar'){const holder=editor;openModal('选择预设头像','<div class="grid3">'+avatars.map(x=>'<button class="choice" style="font-size:36px" data-action="avatar-value" data-value="'+x+'" data-context="'+(isEdit?'edit':'hero')+'">'+x+'</button>').join('')+'</div>');editor=holder;return;}
if(field==='custom-partner'){const holder=editor;openModal('添加自定义伙伴','<label for="partner-name">伙伴昵称（1–12 字）</label><input id="partner-name" maxlength="12" placeholder="比如：小月亮" style="margin-top:8px"><div id="partner-error" role="alert"></div><div class="dialog-actions"><button class="primary" data-action="partner-save" data-context="'+(isEdit?'edit':'hero')+'">添加伙伴</button></div>');editor=holder;return;}
if(field==='trait'){if(h.traits.includes(v))h.traits=h.traits.filter(t=>t!==v);else if(h.traits.length<3)h.traits.push(v);else return notify('性格方向最多选 3 项');}
else h[field]=v;
refresh();return;
}
if(a==='avatar-value'){if(b.dataset.context==='edit'){editor.data.avatar=v;renderEditor();}else{S.hero.avatar=v;closeModal();render();}return;}
if(a==='partner-save'){const name=$('#partner-name').value.trim();if(!name||Array.from(name).length>12||/[\d]{7,}|@|https?:/.test(name)){$('#partner-error').innerHTML='<p class="error">请填写 1–12 字的伙伴昵称，不填写联系方式</p>';return;}if(b.dataset.context==='edit'){editor.data.partner='🌟 '+name;renderEditor();}else{S.hero.partner='🌟 '+name;closeModal();render();}return;}
if(a==='next'){if(S.step===1){const err=S.hero?validHero(S.hero):'请先新建或选择孩子档案';if(err){$('#form-error').innerHTML='<p class="error">'+err+'</p>';$('#form-error').scrollIntoView({block:'nearest'});return;}}S.step++;render();window.scrollTo(0,0);return;}
if(a==='prev'){S.step--;render();window.scrollTo(0,0);return;}
if(a==='world'){S.world=id;const left=$('.worlds').scrollLeft;render();$('.worlds').scrollLeft=left;return;}
if(a==='world-next'||a==='world-prev'){$('.worlds').scrollBy({left:a==='world-next'?200:-200,behavior:'smooth'});return;}
if(a==='growth'){S.theme=v;S.customTheme='';render();return;}
if(a==='shuffle'){S.batch=1-S.batch;render();return;}
if(a==='intent'){S.intent=v;render();return;}
if(a==='skip-material'){S.material='';render();notify('已跳过，其他设定已保留');return;}
if(a==='generate')return beginGeneration();
if(a==='tab'){S.tab=v;render();return;}
if(a==='filter'){S.filter=v==='全部'?'all':S.profiles.find(p=>p.nickname+(p.deleted?'（已删除）':'')===v)?.id||'all';render();return;}
if(a==='story'){S.activeStory=id;const story=storyById(id);if(story.status==='generating'){S.job=id;navigate('loading');}else if(story.status==='failed'){S.job=id;navigate('failure');}else navigate('story');return;}
if(a==='read-generated')return navigate('story');
if(a==='again')return resetDraft(storyById(S.activeStory).snapshot.profileId);
if(a==='restore-for-story'){const p=S.profiles.find(x=>x.id===storyById(S.activeStory).snapshot.profileId);confirm('恢复孩子档案？','恢复后可以继续为 TA 创作；已有故事仍保留当时的设定。','恢复并创作',()=>{p.deleted=false;resetDraft(p.id);});return;}
if(a==='back-to-form'){const sn=storyById(S.job).snapshot;S.selected=sn.profileId;S.hero=clone(sn.child);S.world=sn.world;S.material=sn.material;S.intent=sn.intent;S.theme=sn.theme;S.customTheme='';S.step=3;S.scenario='normal';navigate('create');return;}
if(a==='retry'){S.scenario='normal';storyById(S.job).status='generating';navigate('loading');scheduleGeneration();return;}
if(a==='reload-list'){S.listState='normal';render();return;}
if(a==='apply-scene'){const scene=$('#scene').value;confirm('载入演示场景？','这会清空当前原型中的演示修改，载入一组新的示例数据。','载入场景',()=>applyScene(scene));return;}
if(a==='listen'){S.playing=false;S.seconds=0;$('#audio-demo').innerHTML='<div class="audio-demo"><div class="row between"><b class="small">温柔女声</b><button class="secondary" data-action="play">▶ 播放</button></div><progress id="audio-progress" value="0" max="300"></progress><p class="muted small"><span id="audio-time">00:00</span> / 05:00 · 原型播放状态演示，无实际音频</p></div>';$('#audio-demo').scrollIntoView({block:'center',behavior:'smooth'});return;}
if(a==='play'){S.playing=!S.playing;b.textContent=S.playing?'Ⅱ 暂停':'▶ 播放';clearInterval(audioTimer);if(S.playing)audioTimer=setInterval(()=>{S.seconds=Math.min(300,S.seconds+1);const progress=$('#audio-progress');if(!progress)return clearInterval(audioTimer);progress.value=S.seconds;$('#audio-time').textContent=String(Math.floor(S.seconds/60)).padStart(2,'0')+':'+String(S.seconds%60).padStart(2,'0');if(S.seconds===300){clearInterval(audioTimer);S.playing=false;b.textContent='▶ 播放';}},1000);return;}
if(a==='legacy-like'||a==='legacy-save'){b.classList.toggle('selected');b.textContent=a==='legacy-like'?(b.classList.contains('selected')?'♥ 已赞':'♡ 点赞'):(b.classList.contains('selected')?'★ 已收藏':'☆ 收藏');return;}
if(a==='legacy-share')return notify('仅演示历史公开故事的分享入口，不发送任何内容');
});
$('#modal').addEventListener('cancel',()=>{editor=null;confirmCallback=null;});
const initial=location.hash.slice(1);if(['mine','profiles','explore','create'].includes(initial))S.view=initial;
render();
})();
</script>
</body>
</html>
